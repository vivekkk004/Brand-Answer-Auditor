[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-answer-auditor"
version = "0.1.0"
description = "Audits what AI assistants say about brands: inclusion and claim accuracy."
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[project.scripts]
auditor = "auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated migrations are kept exactly as Alembic wrote them.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

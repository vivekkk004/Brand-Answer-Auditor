name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auditor
          POSTGRES_PASSWORD: auditor
          POSTGRES_DB: auditor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditor -d auditor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database inside this job; not a secret.
      TEST_POSTGRES_URL: postgresql+psycopg://auditor:auditor@localhost:5432/auditor_test
      DATABASE_URL: postgresql+psycopg://auditor:auditor@localhost:5432/auditor_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check the demo data and eval set
        run: auditor check-data

      # Includes the PostgreSQL tests (migrations, SKIP LOCKED, full pipeline), which
      # run because TEST_POSTGRES_URL is set. They leave the database empty.
      - name: Tests
        run: pytest -rs

      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (exact versions from the lock file)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: brand-answer-auditor:ci
